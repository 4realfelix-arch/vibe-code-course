version: "3.8"

services:
  # Open WebUI - Chat interface for LLMs
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: atomic-cat-openwebui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=true
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
      - redis
    networks:
      - atomiccat
    restart: unless-stopped

  # Ollama - Local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: atomic-cat-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - atomiccat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: atomic-cat-redis
    ports:
      - "6379:6379"
    # Note: In production, use redis.conf file instead of command-line args
    # to avoid password exposure in process lists
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - atomiccat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: atomic-cat-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    networks:
      - atomiccat
    restart: unless-stopped

  # n8n - Workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: atomic-cat-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=sqlite
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    networks:
      - atomiccat
    restart: unless-stopped

  # FastAPI Middleware
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: atomic-cat-middleware
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - OPENWEBUI_URL=http://open-webui:8080
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - N8N_WEBHOOK_URL=http://n8n:5678
      - MEM0_URL=${MEM0_URL:-http://host.docker.internal:8080}
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      open-webui:
        condition: service_started
    volumes:
      - ./middleware:/app
    networks:
      - atomiccat
    restart: unless-stopped

  # SvelteKit Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atomic-cat-frontend
    ports:
      - "5173:5173"
    environment:
      - PUBLIC_API_URL=http://localhost:8000
      - PUBLIC_WS_URL=ws://localhost:8000
      - PUBLIC_DEBUG=false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - middleware
    networks:
      - atomiccat
    restart: unless-stopped

networks:
  atomiccat:
    driver: bridge

volumes:
  open-webui-data:
  ollama_models:
  redis_data:
  qdrant_storage:
  n8n_data:
