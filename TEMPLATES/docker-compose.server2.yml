version: "3.8"

services:
  # ComfyUI - Image generation with SDXL
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: atomic-cat-comfyui
    ports:
      - "8188:8188"  # ComfyUI web interface
      - "8118:8118"  # Comfy-Manager
    environment:
      - GPU=all
      - COMFYUI_PORT_HOST=8188
    volumes:
      - comfyui_data:/data
      - comfyui_output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - atomiccat
    restart: unless-stopped

  # Voice Server - STT/TTS with LFM2.5
  voice-server:
    build:
      context: ./voice-server
      dockerfile: Dockerfile
    container_name: atomic-cat-voice
    ports:
      - "8765:8765"
    environment:
      - MODEL_PATH=/models/lfm2.5-audio-1.5b
      - GPU_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${SERVER1_IP:-host.docker.internal}:6379
      - MIDDLEWARE_URL=http://${SERVER1_IP:-host.docker.internal}:8000
      - MAX_CONCURRENT_SESSIONS=4
      - SAMPLE_RATE=16000
      - VAD_THRESHOLD=0.02
    volumes:
      - voice_models:/models
      - ./voice-server:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - atomiccat
    restart: unless-stopped

  # Mem0 - Memory service
  mem0:
    image: mem0ai/mem0:latest
    container_name: atomic-cat-mem0
    ports:
      - "8080:8080"
    environment:
      - MEM0_HOST=0.0.0.0
      - MEM0_PORT=8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - QDRANT_URL=http://${SERVER1_IP:-host.docker.internal}:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - mem0_data:/data
    networks:
      - atomiccat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  atomiccat:
    external: true

volumes:
  comfyui_data:
  comfyui_output:
  voice_models:
  mem0_data:
